<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تمارين">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>برنامج التمارين الأسبوعي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f4f5f8;--card:#fff;--line:#e4e7ee;--tx:#14171f;--mut:#6b7385;--sh:0 8px 30px rgba(20,30,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#171a22;--line:#262b36;--tx:#f2f4f8;--mut:#8b93a3;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f14;--card:#171a22;--line:#262b36;--tx:#f2f4f8;--mut:#8b93a3;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))}
header{padding:8px 4px 18px}
h1{margin:0;font-size:26px;font-weight:800}
header p{margin:4px 0 0;color:var(--mut);font-size:14px}
.view{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);margin-bottom:14px;position:relative;overflow:hidden;transition:transform .2s}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:5px;background:var(--c)}
.card:active{transform:scale(.985)}
.hd{padding:16px 20px 16px 16px;padding-inline-end:22px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day{font-size:20px;font-weight:800}
.tag{font-size:12px;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:99px;padding:3px 11px;white-space:nowrap}
.dots{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mut)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)}
.ttl{margin:10px 0 0;font-weight:700;font-size:15px;line-height:1.5}
.badge{background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-inline-start:8px}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.card.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.note{margin:0 16px 8px;padding-inline-start:10px;border-inline-start:3px solid var(--line);color:var(--mut);font-size:13px;line-height:1.6}
.ex{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px}
.ex small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.ex b{color:var(--c);white-space:nowrap;direction:rtl;font-weight:700}
.chev{transition:transform .35s;color:var(--mut)}
.card.open .chev{transform:rotate(180deg)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pill{flex:none;min-width:62px;text-align:center;padding:9px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;transition:.25s}
.pill.on{background:var(--c);border-color:var(--c);color:#fff;transform:translateY(-2px)}
.hero{display:flex;align-items:center;gap:16px;padding:20px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:18px;line-height:1.4}
.hero p{margin:0;color:var(--mut);font-size:13px}
.ring{flex:none;position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--c);stroke-dasharray:226.2;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px}
.exc{padding:16px}
.exc h3{margin:0;font-size:16px}
.exc .sub{color:var(--mut);font-size:12.5px;margin:3px 0 0}
.tg{color:var(--c);font-weight:700;font-size:13px;margin:8px 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--mut);font:700 16px 'Tajawal',sans-serif;cursor:pointer;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.chip:active{transform:scale(.88)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.06)}
.rest{text-align:center;padding:40px 20px}
.rest .big{font-size:54px}
.rest h2{margin:10px 0 6px}
.rest p{color:var(--mut);line-height:1.7;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{padding:16px 8px;text-align:center;margin:0}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--c)}
.stat span{font-size:12px;color:var(--mut)}
.wk{display:flex;justify-content:space-between;padding:18px 14px}
.wd{text-align:center;font-size:11px;color:var(--mut);font-weight:700}
.wd .ring{width:38px;height:38px;margin:0 auto 6px}
.wd .ring circle{stroke-width:5}
.wd .ring span{font-size:10px}
.sec{font-weight:800;margin:20px 4px 10px;font-size:16px}
.his{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px}
.his small{color:var(--mut);display:block;margin-top:2px}
nav{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar{max-width:420px;margin:0 auto;position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:5px;box-shadow:var(--sh)}
.ind{position:absolute;top:5px;bottom:5px;inset-inline-start:5px;width:calc((100% - 10px)/3);background:var(--line);border-radius:17px;transition:transform .45s cubic-bezier(.3,1.2,.4,1)}
.bar button{position:relative;z-index:1;background:none;border:0;color:var(--mut);font:700 13px 'Tajawal',sans-serif;padding:11px 4px;cursor:pointer;transition:color .3s}
.bar button.on{color:var(--tx)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.45s cubic-bezier(.3,1.4,.5,1);z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><header><h1>🏋️ برنامج التمارين الأسبوعي</h1><p>أسبوع واحد، موجة شدة واحدة: تحضير ← انفجار ← تعافي</p></header><main id="main"></main></div>
<nav><div class="bar"><div class="ind" id="ind"></div>
<button data-t="0">📅 الجدول</button><button data-t="1">✏️ تسجيل اليوم</button><button data-t="2">📊 السجل</button></div></nav>
<div class="toast" id="toast"></div>
<script>
const D=[
{n:'السبت',tag:'دفع ومهارة',i:2,c:'#4c9aff',t:'مهارة الهاندستاند وقوة الأكتاف (دفع فقط)',note:'هنا عضلات الظهر والبايسبس في راحة تامة، لن تجهدها أبداً لكي تكون جاهزة للانفجار غداً.',ex:[
['توازن هاندستاند ضد الحائط','محاولات وتقنية حرة',1,'15 دقيقة'],
['ضغط بايك (Pike Push-ups)','لقوة الكتف المساعد في الهاندستاند',3,'3 × 7'],
['ثبات أعلى المتوازي (Tuck Support Hold)','',3,'3 × 30-45 ثانية']]},
{n:'الأحد',tag:'سحب انفجاري',i:5,c:'#ef5a43',t:'علوي (تفجير السحب والعقلة الانفجارية)',note:'ندخل هذه الحصة وظهرك وجهازك العصبي في قمة الراحة (بعد راحة الجمعة والسبت من السحب).',ex:[
['عقلة انفجارية','سحب سريع وصاروخي للبطن/الصدر',4,'4 × 3'],
['عقلة عادية','حتى الفشل العضلي',3,'3 × أقصى تكرار'],
['متوازي (Dips)','',3,'3 × 6'],
['عقلة أسترالية مائلة','',3,'3 × 10'],
['ضغط عادي','',3,'3 × 15']]},
{n:'الإثنين',tag:'سفلي وبطن',i:4,c:'#5fae5f',t:'سفلي + بطن + مهارة الهاندستاند ضد الحائط',ex:[
['ثبات هاندستاند ضد الحائط','',5,'5 × 45 ثانية'],
['سكوات (قرفصاء)','',4,'4 × 20'],
['لانجز (طاعن)','لكل رجل',3,'3 × 15'],
['بلانك (Plank)','',3,'80 + 60 + 60 ثانية'],
['رفع الأرجل','',3,'3 × 15']]},
{n:'الثلاثاء',tag:'راحة نشطة',i:1,c:'#e0a526',t:'راحة نشطة (مشي، إطالات)',note:'🚶 مشي خفيف وإطالات لتسريع التعافي.',ex:[],rest:'🚶',msg:'مشي خفيف وإطالات لتسريع التعافي.'},
{n:'الأربعاء',tag:'دفع وترايسبس',i:3,c:'#e07b39',t:'علوي (تركيز ضغط وديبس - دفع وقوة ترايسبس)',ex:[
['متوازي (Dips)','',4,'4 × 7'],
['ضغط عادي','',4,'4 × 15-16'],
['عقلة معكوسة (Chin-ups)','سحب خفيف للحفاظ على الحجم',3,'3 × 3-4'],
['ضغط ألماس (Diamond)','',3,'3 × 9']]},
{n:'الخميس',tag:'سفلي وبطن',i:4,c:'#5fae5f',t:'سفلي + بطن + مهارة الهاندستاند ضد الحائط',note:'تكرار كامل لتمارين يوم الإثنين بنفس الجولات والتكرارات.',ex:null,same:2},
{n:'الجمعة',tag:'راحة تامة',i:0,c:'#8a92a3',t:'راحة تامة واستشفاء عضلي',note:'🛌 راحة كاملة — بدون تمارين. النوم والتغذية أولوية اليوم.',ex:[],rest:'🛌',msg:'راحة كاملة — بدون تمارين. النوم والتغذية أولوية اليوم.'}];
D[5].ex=D[2].ex;
const $=s=>document.querySelector(s);
const todayIdx=(new Date().getDay()+1)%7;
let tab=0,sel=todayIdx,openSet=new Set([todayIdx]);
let log={};try{log=JSON.parse(localStorage.getItem('wk-log')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('wk-log',JSON.stringify(log))}catch(e){}};
const dateFor=i=>{const d=new Date();d.setDate(d.getDate()-(todayIdx-i));return d};
const key=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const total=i=>D[i].ex.reduce((a,e)=>a+e[2],0);
const doneOf=(k,i)=>{const l=log[k]||{};return D[i].ex.reduce((a,_,x)=>a+((l[x]||[]).filter(Boolean).length),0)};
const pct=(k,i)=>{const t=total(i);return t?doneOf(k,i)/t:0};
const ring=(p,c,txt)=>`<div class="ring" style="--c:${c}"><svg width="100%" height="100%" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" style="stroke-dashoffset:${226.2*(1-p)}"/></svg><span>${txt}</span></div>`;
const dots=d=>`<div class="dots">شدة ${[1,2,3,4,5].map(n=>`<i class="${n<=d.i?'on':''}"></i>`).join('')}</div>`;
function exRows(d){return d.ex.map(e=>`<div class="ex"><div>${e[0]}${e[1]?`<small>${e[1]}</small>`:''}</div><b>${e[3]}</b></div>`).join('')}
function schedule(){return D.map((d,i)=>`<div class="card ${openSet.has(i)?'open':''}" style="--c:${d.c}" data-i="${i}">
<div class="hd"><div class="row"><div class="day">${d.n}${i===todayIdx?'<span class="badge">اليوم</span>':''}</div><div class="row">${dots(d)}<span class="tag">${d.tag}</span></div></div>
<div class="row"><p class="ttl">${d.t}</p><span class="chev">⌄</span></div></div>
<div class="more"><div>${d.note?`<p class="note">${d.note}</p>`:''}${exRows(d)}</div></div></div>`).join('')}
function today(){
const d=D[sel],k=key(dateFor(sel));
const strip=`<div class="strip">${D.map((x,i)=>`<div class="pill ${i===sel?'on':''}" style="--c:${x.c}" data-s="${i}">${x.n}${i===todayIdx?' •':''}</div>`).join('')}</div>`;
if(!d.ex.length)return strip+`<div class="card rest" style="--c:${d.c}"><div class="big">${d.rest}</div><h2>${d.t}</h2><p>${d.msg}</p></div>`;
const p=pct(k,sel),l=log[k]||{};
return strip+`<div class="card hero" style="--c:${d.c}">${ring(p,d.c,Math.round(p*100)+'%')}<div><h2>${d.t}</h2><p>${doneOf(k,sel)} / ${total(sel)} جولة مكتملة</p></div></div>`+
d.ex.map((e,x)=>`<div class="card exc" style="--c:${d.c}"><h3>${e[0]}</h3>${e[1]?`<p class="sub">${e[1]}</p>`:''}<div class="tg">${e[3]}</div><div class="chips">${Array.from({length:e[2]},(_,s)=>`<button class="chip ${(l[x]||[])[s]?'on':''}" data-x="${x}" data-n="${s}">${s+1}</button>`).join('')}</div></div>`).join('')}
function history(){
let sessions=0,sets=0,streak=0,list=[];
for(let n=0;n<120;n++){const dt=new Date();dt.setDate(dt.getDate()-n);const i=(dt.getDay()+1)%7;if(!D[i].ex.length)continue;const k=key(dt),dn=doneOf(k,i);
if(dn>0){sets+=dn;if(dn===total(i))sessions++;if(list.length<8)list.push([dt,i,pct(k,i)])}}
let brk=false;for(let n=0;n<120&&!brk;n++){const dt=new Date();dt.setDate(dt.getDate()-n);const i=(dt.getDay()+1)%7;if(!D[i].ex.length)continue;const p=pct(key(dt),i);if(p===1)streak++;else if(n>0)brk=true}
const wk=D.map((d,i)=>{const p=d.ex.length?pct(key(dateFor(i)),i):0;return `<div class="wd">${ring(p,d.c,d.ex.length?(p===1?'✓':''):'—')}${d.n.replace('ال','')}</div>`}).join('');
return `<div class="stats"><div class="card stat" style="--c:#e07b39"><b>${streak}</b><span>🔥 أيام متتالية</span></div><div class="card stat" style="--c:#5fae5f"><b>${sessions}</b><span>حصص مكتملة</span></div><div class="card stat" style="--c:#4c9aff"><b>${sets}</b><span>جولات منجزة</span></div></div>
<div class="sec">هذا الأسبوع</div><div class="card wk" style="--c:var(--line)">${wk}</div>
<div class="sec">آخر الحصص</div>${list.length?list.map(([dt,i,p])=>`<div class="card his" style="--c:${D[i].c}"><div><b>${D[i].n} — ${D[i].tag}</b><small>${dt.toLocaleDateString('ar-DZ',{day:'numeric',month:'long'})}</small></div><b style="color:${D[i].c}">${Math.round(p*100)}%</b></div>`).join(''):'<div class="card his" style="--c:var(--line)"><span style="color:var(--mut)">لا توجد حصص مسجلة بعد. ابدأ من تبويب «تسجيل اليوم».</span></div>'}`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function render(){
$('#ind').style.transform=`translateX(${-tab*100}%)`;
document.querySelectorAll('.bar button').forEach((b,i)=>b.classList.toggle('on',i===tab));
$('#main').innerHTML=`<div class="view">${[schedule,today,history][tab]()}</div>`}
document.addEventListener('click',ev=>{
const t=ev.target.closest('[data-t],[data-s],.chip,.hd');if(!t)return;
if(t.dataset.t!==undefined){tab=+t.dataset.t;render();scrollTo({top:0,behavior:'smooth'})}
else if(t.dataset.s!==undefined){sel=+t.dataset.s;render()}
else if(t.classList.contains('hd')){const c=t.parentElement,i=+c.dataset.i;c.classList.toggle('open');c.classList.contains('open')?openSet.add(i):openSet.delete(i)}
else if(t.classList.contains('chip')){
const k=key(dateFor(sel)),x=+t.dataset.x,n=+t.dataset.n;
log[k]=log[k]||{};const a=log[k][x]=log[k][x]||[];a[n]=!a[n];save();
try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
t.classList.toggle('on',a[n]);
const p=pct(k,sel),c=$('.hero');c.querySelector('.fg').style.strokeDashoffset=226.2*(1-p);
c.querySelector('.ring span').textContent=Math.round(p*100)+'%';c.querySelector('p').textContent=doneOf(k,sel)+' / '+total(sel)+' جولة مكتملة';
if(p===1&&a[n])toast('أحسنت! أنهيت حصة اليوم 🔥')}});
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
